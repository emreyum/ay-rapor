<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dosya Rapor Sistemi</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <div class="container">
    <h1>Dosya Rapor Sistemi</h1>

    <div class="section">
      <label>Büro Adı</label>
      <input id="bureauName" type="text" placeholder="Örn: Yılmaz Hukuk Bürosu" />
    </div>

    <div class="section">
      <label>Müvekkil Adı *</label>
      <input id="clientName" type="text" placeholder="Örn: Ali Veli" />
    </div>

    <div class="section">
      <label>Rapor Tarihi</label>
      <input id="reportDate" type="date" />
    </div>

    <div class="section">
      <label>Büro Logosu (isteğe bağlı)</label>
      <input id="logoInput" type="file" accept="image/*" />
      <img id="logoPreview" style="display:none; max-height:80px; margin-top:8px;" />
    </div>

    <div id="cases"></div>

    <button id="addCaseBtn">Yeni Dosya Ekle</button>
    <button id="downloadBtn" disabled>Raporu İndir</button>
    <button id="exampleBtn">Örnek Veri Doldur</button>

    <p class="info">* işaretli alanlar zorunludur.</p>
  </div>
</body>
</html>
